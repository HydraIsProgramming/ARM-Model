[pytest]
testpaths = project_assets/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    slow: trains a small SAC model (tens of seconds)
# The headless matplotlib backend is pinned in project_assets/tests/conftest.py
# (MPLBACKEND=Agg, set before matplotlib is imported). Do not rely on the
# default backend: with TkAgg the drawing tests fail whenever the GUI is open.
